{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4" style="border: 1.5px solid #A8D5A2; border-radius: 15px;">
                <h4 style="color: #58AF50; font-weight: 700;">👷 Add New Staff</h4>
                <hr style="border-color: #A8D5A2;">
                <form method="POST" action="/admin/staff/add">
                    <div class="mb-3">
                        <label style="color: #555;">Username</label>
                        <input type="text" name="username" class="form-control" 
                        style="border: 1.5px solid #A8D5A2; border-radius: 8px;" required>
                    </div>
                    <div class="mb-3">
                        <label style="color: #555;">Email</label>
                        <input type="email" name="email" class="form-control" 
                        style="border: 1.5px solid #A8D5A2; border-radius: 8px;" required>
                    </div>
                    <div class="mb-3">
                        <label style="color: #555;">Password</label>
                        <input type="password" name="password" class="form-control" 
                        style="border: 1.5px solid #A8D5A2; border-radius: 8px;" required>
                    </div>
                    <div class="mb-3">
                        <label style="color: #555;">Contact Number</label>
                        <input type="text" name="contact" class="form-control" 
                        style="border: 1.5px solid #A8D5A2; border-radius: 8px;" required>
                    </div>
                    <button type="submit" class="btn w-100 mt-2" 
                    style="background-color: #26DF20; color: white; border-radius: 10px;">
                    Add Staff</button>
                </form>
                <div class="mt-3">
                    <a href="/admin/staff" style="color: #58AF50;">← Back to Staff</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
