{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4" style="border: 1.5px solid #A8D5A2; border-radius: 15px;">
                <h4 style="color: #58AF50; font-weight: 700;">👤 My Profile</h4>
                <hr style="border-color: #A8D5A2;">
                <form method="POST" action="/user/profile">
                    <div class="mb-3">
                        <label style="color: #555;">Username</label>
                        <input type="text" name="username" class="form-control"
                        style="border: 1.5px solid #A8D5A2; border-radius: 8px;"
                        value="{{ user.username }}" required>
                    </div>
                    <div class="mb-3">
                        <label style="color: #555;">Email</label>
                        <input type="email" name="email" class="form-control"
                        style="border: 1.5px solid #A8D5A2; border-radius: 8px;"
                        value="{{ user.email }}" required>
                    </div>
                    <div class="mb-3">
                        <label style="color: #555;">New Password 
                            <small style="color: #888;">(leave blank to keep current)</small>
                        </label>
                        <input type="password" name="password" class="form-control"
                        style="border: 1.5px solid #A8D5A2; border-radius: 8px;">
                    </div>
                    <button type="submit" class="btn w-100 mt-2"
                    style="background-color: #26DF20; color: white; border-radius: 10px;">
                    Update Profile</button>
                </form>
                <div class="mt-3">
                    <a href="/user/dashboard" style="color: #58AF50;">← Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
